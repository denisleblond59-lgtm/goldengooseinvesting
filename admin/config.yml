backend:
  name: github
  repo: denisleblond59-lgtm/goldengooseinvesting
  branch: main 
  base_url: https://goldengooseinvesting.vercel.app
  auth_endpoint: /api/auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "faq_en"
    label: "FAQs (English)"
    files:
      - file: "data/faq-en.json" # Path to EN FAQ data file
        label: "English FAQ Items"
        name: "faq_en_file"
        fields:
          - label: "FAQ List"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "markdown" }
              - { label: "Category", name: "category", widget: "string", required: false }

  - name: "faq_cs"
    label: "FAQs (Czech)"
    files:
      - file: "data/faq-cs.json" # Path to CS FAQ data file
        label: "Czech FAQ Items"
        name: "faq_cs_file"
        fields:
          - label: "FAQ List"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "markdown" }
              - { label: "Category", name: "category", widget: "string", required: false }

  - name: "faq_de"
    label: "FAQs (German)"
    files:
      - file: "data/faq-de.json" # Path to DE FAQ data file
        label: "German FAQ Items"
        name: "faq_de_file"
        fields:
          - label: "FAQ List"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "markdown" }
              - { label: "Category", name: "category", widget: "string", required: false }

  - name: "about"
    label: "About Stefan"
    files:
      - file: "data/about.en.json"
        label: "About Stefan (English)"
        name: "about_en"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Bio", name: "bio", widget: "markdown" }
          - { label: "Image", name: "image", widget: "image" }
      - file: "data/about.cs.json"
        label: "About Stefan (Czech)"
        name: "about_cs"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Bio", name: "bio", widget: "markdown" }
          - { label: "Image", name: "image", widget: "image" }
      - file: "data/about.de.json"
        label: "About Stefan (German)"
        name: "about_de"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Bio", name: "bio", widget: "markdown" }
          - { label: "Image", name: "image", widget: "image" }