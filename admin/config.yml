backend:
  name: github
  repo: denisleblond59-lgtm/goldengooseinvesting
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

# Configuration multilingue : Anglais (par défaut), Tchèque, Allemand
i18n:
  structure: multiple_folders
  locales: [en, cs, de]
  default_locale: en

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - file: "content/home.json"
        label: "Page d'accueil"
        name: "home"
        i18n: true
        fields:
          - { label: "Titre principal", name: "title", widget: "string", i18n: true }
          - { label: "Sous-titre", name: "subtitle", widget: "text", i18n: true }
          - { label: "Bouton d'action", name: "cta_text", widget: "string", i18n: true }
          
