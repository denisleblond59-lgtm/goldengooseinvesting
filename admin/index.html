<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion de contenu - Golden Goose</title>
</head>
<body>
  <!-- Inclusion de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  // Injection directe du Personal Access Token pour contourner l'authentification OAuth
  if (!localStorage.getItem('decap-cms-user')) {
    const user = {
      token: "TON_TOKEN_ICI",
      backendName: "github"
    };
    localStorage.setItem('decap-cms-user', JSON.stringify(user));
  }
</script>
</body>
</html>
