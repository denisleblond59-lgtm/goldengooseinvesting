name: Gemini Auto-Developer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  auto-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gen AI SDK
        run: npm install @google/genai

      - name: Execute Gemini Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module -e '
          import { GoogleGenAI } from "@google/genai";
          import fs from "fs";

          const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
          const html = fs.existsSync("index.html") ? fs.readFileSync("index.html", "utf8") : "";
          const css = fs.existsSync("style.css") ? fs.readFileSync("style.css", "utf8") : "";

          const prompt = `Tu es un développeur web expert.
          Demande de modification (Issue GitHub) :
          Titre: ${process.env.ISSUE_TITLE}
          Description: ${process.env.ISSUE_BODY}

          Code actuel index.html :
          \`\`\`html
          ${html}
          \`\`\`

          Code actuel style.css :
          \`\`\`css
          ${css}
          \`\`\`

          Exécute les modifications demandées.
          Réponds STRICTEMENT sous la forme d'un objet JSON valide au format suivant, sans aucun autre texte autour :
          {
            "index_html": "contenu intégral mis à jour de index.html",
            "style_css": "contenu intégral mis à jour de style.css"
          }`;

          async function run() {
            try {
              const response = await ai.models.generateContent({
                model: "gemini-2.5-flash",
                contents: prompt,
                config: { responseMimeType: "application/json" }
              });

              const res = JSON.parse(response.text);
              if (res.index_html && fs.readFileSync("index.html", "utf8") !== res.index_html) {
                fs.writeFileSync("index.html", res.index_html);
              }
              if (res.style_css && fs.readFileSync("style.css", "utf8") !== res.style_css) {
                fs.writeFileSync("style.css", res.style_css);
              }
              console.log("Mise à jour appliquée avec succès.");
            } catch (e) {
              console.error("Erreur d'exécution Gemini :", e);
              process.exit(1);
            }
          }
          run();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "gemini-bot@github.com"
          git add .
          git diff --staged --quiet || (git commit -m "auto: mise à jour via issue #${{ github.event.issue.number }}" && git push)
